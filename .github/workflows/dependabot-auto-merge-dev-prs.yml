---
name: Auto-approve dependabot dev dependencies PRs
"on": pull_request
permissions: {}
jobs:
  auto-merge-dependabot:
    permissions:
      contents: write
      pull-requests: write
    uses: skarzi/ci/.github/workflows/dependabot-auto-merge.yml@v1
    with:
      merge-method: squash
      dependency-type: direct:development
      update-type: ""
