---
session_name: ci
start_directory: "${HOME}/dev/ci"
shell_command_before:
  shell_command:
    - cmd: clear
      enter: true
windows:
  - window_name: dev
    focus: true
    layout: even-horizontal
    options:
      automatic-rename: true
    panes:
      - focus: true
      - shell_command:
          - enter: false
            cmd: 'make '
  - window_name: ai-agents
    layout: main-vertical
    suppress_history: false
    options:
      automatic-rename: true
    panes:
      - focus: true
        shell_command:
          - enter: false
            cmd: claude
